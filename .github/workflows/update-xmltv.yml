name: Update XMLTV guide

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and merge XMLTV feeds
        run: python tools/merge_xmltv.py
      - name: Commit updated guide
        run: |
          git add merged.xml
          if git diff --cached --quiet -- merged.xml; then
            echo 'merged.xml is already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update XMLTV guide'
          git push
