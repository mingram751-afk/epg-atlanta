name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download EPG
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://epg.pw/xmltv/epg_US.xml" -o docs/guide.xml

      - name: Commit changed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide.xml
          git diff --cached --quiet || git commit -m "Update EPG guide"
          git push
