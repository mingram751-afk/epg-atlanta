name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # Runs at 17 minutes past the hour, every 6 hours

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04   # Prevent ubuntu-latest migration issues

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download EPG
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://epg.pw/xmltv/epg_US.xml" -o docs/guide.xml

      - name: Commit changed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide.xml
          git diff --cached --quiet || git commit -m "Update EPG guide"
          git push
