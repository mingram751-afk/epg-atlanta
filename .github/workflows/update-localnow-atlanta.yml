name: Update LocalNow Atlanta playlist and guide

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh Atlanta LocalNow files
        run: python tools/update_localnow_atlanta.py
      - name: Commit changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localnow_atlanta.m3u localnow_atlanta_epg.xml
          git diff --cached --quiet || git commit -m "Update LocalNow Atlanta playlist and guide"
          git push
